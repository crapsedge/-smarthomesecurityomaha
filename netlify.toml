[build]
  publish = "."

[[headers]]
  for = "/*"

  [headers.values]

    Strict-Transport-Security = "max-age=31536000"

    X-Content-Type-Options = "nosniff"

    X-Frame-Options = "DENY"

    Referrer-Policy = "no-referrer"

    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()"

    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; upgrade-insecure-requests"

    Cross-Origin-Opener-Policy = "same-origin"

    Cross-Origin-Resource-Policy = "same-origin"

    X-Permitted-Cross-Domain-Policies = "none"


[[headers]]
  for = "/employeehire.html"

  [headers.values]

    Cache-Control = "no-store"


[[headers]]
  for = "/employeehire-thank-you.html"

  [headers.values]

    Cache-Control = "no-store"
